# Source: EXPAND.3 Phase I spec, Parameters > Links, SAA, C&DH, imager; Signals table.
crosslink: {range_km: 1500, cadence: control_tick, rx_noise_pos_m: 20, rx_noise_vel_m_s: 0.02, drop_probability: 0}
saa: {boundary_nT: 22000, field_model: IGRF-14}
edge_computer_reboot_s: 60
cdh_upsets: {lambda_out_per_s: 1.1574074074074073e-05, lambda_in_per_s: 5.555555555555556e-04, reset_fraction: 0.05}  # 1/86400, 1/1800
imager_dark_current: {D0_e_s_px: 10, T_ref_K: 293.15, delta_T_K: 6.5}
signals:
  gnss: {rate_s: 60, pos_sigma_m: 1.5, vel_sigma_m_s: 0.05}
  star_tracker: {rate_s: 30}
  imu: {rate_s: 30, sigma_rad_s: 5.0e-5}
  pack_voltage: {rate_s: 30, sigma_V: 0.04}
  pack_current: {rate_s: 30, bias_A: 0.05, sigma_A: 0.02}
  soc_estimate: {rate_s: 30, initial_error_sigma: 0.02, steep_soc_low: 0.1, steep_soc_high: 0.9, rest_current_A: 0.5}   # steep/rest thresholds: default, spec silent
  string_power: {rate_s: 30, rel_sigma: 0.01}
  node_temperature: {rate_s: 30, sigma_K: 0.5}
  tank_gauge: {rate_s: 30, sigma_kg: 0.1}
