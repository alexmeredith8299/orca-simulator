# Scenario and environment. Source: EXPAND.3 Phase I spec, Parameters > Scenario and environment.
orbit:
  a_km: 6903.137            # 525 km altitude
  e: 0.0001
  i_deg: 97.497
  ltan_hours: 22.5          # LTAN 22:30 (descending node 10:30)
  arg_perigee_deg: 0.0
true_anomaly_at_epoch_deg: {SAT-1: 0, SAT-2: 2, SAT-3: 4, SAT-4: 180, SAT-5: 182, SAT-6: 184}
bus_of: {SAT-1: A, SAT-2: A, SAT-3: A, SAT-4: A, SAT-5: B, SAT-6: B}
clusters: [[SAT-1, SAT-2, SAT-3], [SAT-4, SAT-5, SAT-6]]
burn_vehicles: [SAT-2, SAT-3, SAT-4]
take_vehicles: [SAT-2, SAT-3, SAT-4]
epoch: {draw: uniform, year: 2027}
run_length_h: {draw: uniform, low: 48, high: 72}
integration_step_s: 10
control_tick_s: 30
ground_stations:
  - {name: Svalbard, lat_deg: 78.23, lon_deg: 15.41}
  - {name: Fairbanks, lat_deg: 64.86, lon_deg: -147.85}
  - {name: Wallops, lat_deg: 37.94, lon_deg: -75.46}
elevation_mask_deg: 5
burn_command_time_h: {draw: uniform, low: 12, high: 36, per: burn_vehicle}
station_keeping_burn_length_h: {nominal: 6, note: "About 6 h; varies by seed (distribution not specified, see spec gap)"}
station_keeping_burn_length_draw_h: {draw: uniform, low: 5, high: 7}   # default, spec silent ("about 6 h; varies by seed")
station_keeping_dv_m_s: 1.0     # default, spec silent: delivered delta-v at nominal eta_F, prograde
take_duration_s: 60             # default, spec silent
eps_initial_soc: 0.8            # default, spec silent
thermal_init: settled           # default, spec silent: settled (orbit-averaged steady state + spin-up) or fixed
thermal_init_orbits: 3          # default, spec silent: periodic orbits flown from the steady state before epoch
thermal_initial_K: 293.15       # default, spec silent: every node starts here when thermal_init is fixed
# Temporary node temperatures for EPS until the M5 thermal network supplies them (default, spec silent)
placeholder_node_temperature_K: {wings: 298.15, battery: 293.15, payload: 293.15}
# Slew defaults: not in spec (spec: "minimum-torque plan with a PD trim"). See CLAUDE.md Known gaps.
slew:
  step_s: 1                  # attitude + wheel integration step inside the control tick
  torque_fraction: 0.8       # plan uses this fraction of the torque the array can deliver about the slew axis
  momentum_fraction: 0.8     # and of the wheel momentum capacity (sets the coast rate)
  pd_natural_freq_rad_s: 0.3
  pd_damping: 0.9
  tol_angle_deg: 0.1
  tol_rate_rad_s: 1.0e-4
  max_settle_s: 300          # give up this long after the planned end
take_window_start_h: 30     # first point after 30 h where take constraints hold
take_constraints: {max_off_nadir_deg: 45, min_sun_elevation_at_target_deg: 10}
fault_lead_s: {draw: uniform, low: 5700, high: 11400}
constants:
  mu_km3_s2: 398600.4418
  J2: 1.08262668e-3
  R_E_km: 6378.137
  S_W_m2: 1361
  a_alb: 0.30
  q_IR_W_m2: 237
  sigma_W_m2_K4: 5.670374e-8
  g0_m_s2: 9.80665
  omega_E_rad_s: 7.2921159e-5   # not in spec: Earth rotation rate, IERS Conventions (2010) nominal
  R_sun_km: 695700             # not in spec: nominal solar radius, IAU 2015 Resolution B3 (dual-cone eclipse)
drag:
  h0_km: 525
  rho0_kg_m3: {draw: loguniform, low: 1.0e-13, high: 1.0e-12}
  H_km: {draw: uniform, low: 60, high: 70}
