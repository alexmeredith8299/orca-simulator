# Bus B (SAT-5, SAT-6). Only entries that differ from Bus A; loader merges onto bus_a.yaml.
# Source: EXPAND.3 Phase I spec, Parameters (Bus B columns) and "Thermal links, limits and Bus B".
mass:
  wet_mass_kg: 180
  inertia_diag_kg_m2: [20, 18, 13]
  airframe_box_m: [0.7, 0.7, 1.0]
drag: {Cd: 2.2, area_m2: 1.0}
wings: {count: 3, names: [wing_px, wing_nx, wing_py], sunward_area_m2: 0.60}
thruster: {face: "-y", axis_b: [0, 1, 0]}
wheels: {tau_max_Nm: 0.075, h_max_Nms: 3, power_while_torquing_W: 8}
star_tracker: {noise_cross_arcsec: 3, noise_roll_arcsec: 25}
eps:
  strings: 3
  string_area_m2: 0.60
  string_health: [1, 1, 1]
  eta0: 0.28
  battery: 8s5p Li-ion     # SAT-5 carries Bus A's cell lot
  E_cap_J: 4.32e6
  R_pack_ohm: 0.064
  P_c_max_W: 360
thermal:
  face_area_m2: {x: 0.70, y: 0.70, z: 0.49}
  face_C_J_K: 3000
  wing_area_m2: 1.20
  wing_sunward_m2: 0.60
  wing_C_J_K: 2800
  battery_C_J_K: 9500
  core_C_J_K: 72000
  remove_nodes: [wing_ny]
  stability_limit_s: 124
