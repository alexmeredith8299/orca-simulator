[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expand3"
version = "0.0.0"
description = "EXPAND.3 Phase I six-SmallSat fault simulator (Orca SBIR)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    "astropy",
    "ppigrf",
    "numba",
]

[project.scripts]
expand3 = "expand3.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "types-PyYAML",
]
# data-driven detectors in expand3.detect
detect-ml = [
    "scikit-learn",
]
# Monte Carlo dropout detectors; on a CUDA machine install torch from the matching wheel index
detect-dl = [
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expand3 = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT"]
# Spec symbols (E_cap_J, R_pack_ohm, C_J_K, T, G, Q, ...) are kept verbatim as names.
ignore = ["N803", "N806", "N815"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ppigrf", "ppigrf.*", "scipy", "scipy.*", "astropy", "astropy.*", "erfa", "erfa.*", "pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not batch100"]
markers = [
    "slow: long propagations (72 h); run by default and in CI, skip with -m 'not slow'",
    "batch100: the 100-seed batch; not run by default (pytest -m batch100)",
]
